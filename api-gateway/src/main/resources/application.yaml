server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-public
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/login, /api/auth/register, /api/auth/refresh, /login, /register, /logout
              filters:
                - RewriteLocationResponseHeader=AS_IN_REQUEST, Location, localhost:8080

            - id: auth-static
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/css/**, /auth/js/**, /auth/images/**

            - id: auth-home
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/
              filters:
                - RewriteLocationResponseHeader=AS_IN_REQUEST, Location, localhost:8080

            - id: auth-protected
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/profile, /admin
              filters:
                - JwtAuth
                - RewriteLocationResponseHeader=AS_IN_REQUEST, Location, localhost:8080

            - id: product-images
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/images/**

            - id: product-categories
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/categories/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: productCB
                    fallbackUri: forward:/fallback/product

            - id: product-featured
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/featured
              filters:
                - name: CircuitBreaker
                  args:
                    name: productCB
                    fallbackUri: forward:/fallback/product

            - id: product-public
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/featured, /api/products/page, /api/categories/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: productCB
                    fallbackUri: forward:/fallback/product

            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/inv/**
              filters:
                - JwtAuth
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    series:
                      - SERVER_ERROR
                    exceptions:
                      - java.io.IOException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
                - name: CircuitBreaker
                  args:
                    name: productCB
                    fallbackUri: forward:/fallback/product

            - id: product-pages
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/product/**, /catalog/**, /cart, /orders
              filters:
                - name: CircuitBreaker
                  args:
                    name: productCB
                    fallbackUri: forward:/fallback/product

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**
              filters:
                - JwtAuth
                - name: CircuitBreaker
                  args:
                    name: orderCB
                    fallbackUri: forward:/fallback/order

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - JwtAuth
                - name: CircuitBreaker
                  args:
                    name: paymentCB
                    fallbackUri: forward:/fallback/payment

            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/cart/**
              filters:
                - JwtAuth

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: false

jwt:
  secret: ${JWT_SECRET:superSecretKeyForAuthService2025MustBeLongEnoughForHS256}

admin:
  api-key: ${ADMIN_API_KEY:admin-secret-key-12345}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      productCB:
        base-config: default
      paymentCB:
        base-config: default
      orderCB:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
    instances:
      productCB:
        base-config: default
      paymentCB:
        base-config: default
      orderCB:
        base-config: default
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
