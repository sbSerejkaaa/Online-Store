services:
  # ===== POSTGRESQL =====
  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-order:
    image: postgres:15-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345qwert
    ports:
      - "5432:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-product:
    image: postgres:15-alpine
    container_name: postgres-product
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345qwert
    ports:
      - "5433:5432"
    volumes:
      - postgres_product_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:15-alpine
    container_name: postgres-payment
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345qwert
    ports:
      - "5434:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:15-alpine
    container_name: postgres-notification
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345qwert
    ports:
      - "5436:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-saga:
    image: postgres:15-alpine
    container_name: postgres-saga
    environment:
      POSTGRES_DB: saga_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345qwert
    ports:
      - "5437:5432"
    volumes:
      - postgres_saga_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== KAFKA =====
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ===== REDIS =====
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== MAILHOG =====
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network

  # ===== PROMETHEUS =====
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===== GRAFANA =====
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  # ===== DISCOVERY SERVER =====
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - app-network

  # ===== API GATEWAY =====
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: api-gateway
      JWT_SECRET: superSecretKeyForAuthService2025MustBeLongEnoughForHS256
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery-server
    networks:
      - app-network

  # ===== AUTH SERVICE =====
  auth-service:
    build:
      context: .
      dockerfile: authService/Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: auth-service
      JWT_SECRET: superSecretKeyForAuthService2025MustBeLongEnoughForHS256
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - app-network

  # ===== PRODUCT SERVICE =====
  product-service:
    build:
      context: .
      dockerfile: product/Dockerfile
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres-product:5432/inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: 12345qwert
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: product-service
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-product:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - app-network

  # ===== ORDER SERVICE =====
  order-service:
    build:
      context: .
      dockerfile: order/Dockerfile
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres-order:5432/order_db
      DB_USERNAME: postgres
      DB_PASSWORD: 12345qwert
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: order-service
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - app-network

  # ===== PAYMENT SERVICE =====
  payment-service:
    build:
      context: .
      dockerfile: payment/Dockerfile
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres-payment:5432/payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: 12345qwert
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: payment-service
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - app-network

  # ===== SAGA SERVICE =====
  saga-service:
    build:
      context: .
      dockerfile: saga/Dockerfile
    container_name: saga-service
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres-saga:5432/saga_db
      DB_USERNAME: postgres
      DB_PASSWORD: 12345qwert
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: saga-service
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-saga:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - app-network

  # ===== CART SERVICE =====
  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: cart-service
    ports:
      - "8087:8087"
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: cart-service
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery-server
      - redis
    networks:
      - app-network

  # ===== NOTIFICATION SERVICE (опционально) =====
  notification-service:
    build:
      context: .
      dockerfile: notificationService/Dockerfile
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      DB_USERNAME: postgres
      DB_PASSWORD: 12345qwert
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: notification-service
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - app-network

volumes:
  postgres_auth_data:
  postgres_order_data:
  postgres_product_data:
  postgres_payment_data:
  postgres_notification_data:
  postgres_saga_data:
  kafka_data:

networks:
  app-network:
    driver: bridge