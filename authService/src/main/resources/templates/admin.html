<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/auth/css/space-style.css}">
</head>
<body>
<div class="space-bg" style="background-image: url('/auth/images/fon.jpg');"></div>
<canvas id="stars"></canvas>

<div id="clock-widget">
    <div id="clock-time">00:00:00</div>
    <div id="clock-date">-- --- ----</div>
</div>

<div id="online-widget" style="top: 100px;">
    <span class="online-dot"></span>
    <span id="online-count">42</span> человек онлайн
</div>

<div class="content">
    <div class="welcome-box">
        <div class="logo">👑</div>
        <h1>Админ-панель</h1>
        <p>Только для администраторов</p>

        <div class="info-card" style="margin: 20px 0;">
            <div class="info-label">Твой ID</div>
            <div class="info-value" th:text="${userId}">userId</div>
        </div>

        <div class="info-card" style="margin: 20px 0;">
            <div class="info-label">Твои права</div>
            <div class="info-value" th:text="${authorities}">[ROLE_ADMIN]</div>
        </div>

        <div class="buttons">
            <a href="/profile" class="btn btn-login">← В личный кабинет</a>
        </div>
    </div>
</div>

<script th:src="@{/auth/js/space-script.js}"></script>
</body>
</html>
