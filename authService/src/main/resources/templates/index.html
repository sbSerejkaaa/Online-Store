<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Store</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/auth/css/space-style.css}">
</head>
<body>
<div class="space-bg" style="background-image: url('/auth/images/image-1.jpg');"></div>
<canvas id="stars"></canvas>

<!-- ★ ЧАСЫ -->
<div id="clock-widget">
    <div id="clock-time">00:00:00</div>
    <div id="clock-date">-- --- ----</div>
</div>

<!-- ★ ФРАЗА -->
<div id="phrase-widget">
    <div id="phrase-text">Добро пожаловать в Online Store</div>
</div>

<!-- ★ СЧЁТЧИК ОНЛАЙН -->
<div id="online-widget">
    <span class="online-dot"></span>
    <span id="online-count">42</span> человек онлайн
</div>

<!-- ★ КНОПКА ЗОЛОТОГО РЕЖИМА -->
<button id="golden-toggle" onclick="toggleGoldenMode()" aria-label="Золотой режим">
    <span id="golden-icon">✨</span>
    <span id="golden-label">Золото</span>
</button>

<!-- ★ ПЛЕЕР -->
<button id="music-toggle" onclick="toggleMusic()" aria-label="Включить музыку">
    <span id="music-icon">▶</span>
    <span id="music-label">Lo-fi</span>
</button>

<audio id="music-player" loop preload="none">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
</audio>

<div class="content">
    <div class="welcome-box">
        <div class="logo">🛒</div>
        <h1>Online Store</h1>
        <p>Добро пожаловать в наш магазин</p>
        <div class="buttons">
            <a href="/register" class="btn btn-register">Зарегистрироваться</a>
            <a href="/login" class="btn btn-login">Войти</a>
        </div>
    </div>
</div>

<script th:src="@{/auth/js/space-script.js}"></script>
</body>
</html>
