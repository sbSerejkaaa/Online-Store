<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/auth/css/space-style.css}">
</head>
<body>
<div class="space-bg" style="background-image: url('/auth/images/fon.jpg');"></div>
<canvas id="stars"></canvas>

<!-- ★ ЧАСЫ -->
<div id="clock-widget">
    <div id="clock-time">00:00:00</div>
    <div id="clock-date">-- --- ----</div>
</div>

<!-- ★ ПРИВЕТСТВИЕ -->
<div id="welcome-widget">
    <div class="welcome-line line-1">Создайте аккаунт</div>
    <div class="welcome-line line-2">за 30 секунд</div>
    <div class="welcome-line line-3">и начните покупки</div>
</div>

<!-- ★ ЛОГОТИП -->
<div id="logo-widget">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">
        <div class="logo-title">ONLINE STORE</div>
    </div>
    <div class="logo-icon">⚡</div>
</div>

<div class="content">
    <div class="welcome-box">
        <div class="logo">🛒</div>
        <h2>Регистрация</h2>
        <p class="subtitle">Создайте аккаунт в нашем магазине</p>

        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="success" th:if="${success}" th:text="${success}"></div>

        <form th:action="@{/register}" th:object="${userRegistrationRequest}" method="post">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" th:field="*{userName}" placeholder="Введите имя" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="example@mail.ru" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" th:field="*{password}" placeholder="Минимум 8 символов" required>
                <small style="color: rgba(255,217,122,0.7); font-size: 11px; margin-top: 5px; display: block;">
                    Минимум 8 символов, 1 заглавная, 1 цифра, 1 спецсимвол
                </small>
            </div>
            <button type="submit">Создать аккаунт</button>
        </form>

        <a href="/" class="back-link">← На главную</a>
    </div>
</div>

<script th:src="@{/auth/js/space-script.js}"></script>
</body>
</html>
