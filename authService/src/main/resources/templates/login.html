<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/auth/css/space-style.css}">
</head>
<body>
<div class="space-bg" style="background-image: url('/auth/images/image-1.jpg');"></div>
<canvas id="stars"></canvas>

<div class="content">
    <div class="welcome-box">
        <div class="logo">🔑</div>
        <h2>Вход</h2>
        <p class="subtitle">Войдите в свой аккаунт</p>

        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="success" th:if="${success}" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="example@mail.ru" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Введите пароль" required>
            </div>
            <button type="submit">Войти</button>
        </form>

        <a href="/" class="back-link">← На главную</a>
    </div>
</div>

<script th:src="@{/auth/js/space-script.js}"></script>
</body>
</html>
