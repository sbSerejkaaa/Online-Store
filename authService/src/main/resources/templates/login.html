<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/auth/css/space-style.css}">
</head>
<body>
<div class="space-bg" style="background-image: url('/auth/images/image-1.jpg');"></div>
<canvas id="stars"></canvas>

<div id="clock-widget">
    <div id="clock-time">00:00:00</div>
    <div id="clock-date">-- --- ----</div>
</div>

<div id="phrase-widget">
    <div id="phrase-text">Добро пожаловать</div>
</div>

<div id="online-widget">
    <span class="online-dot"></span>
    <span id="online-count">42</span> человек онлайн
</div>

<button id="golden-toggle" onclick="toggleGoldenMode()" aria-label="Золотой режим">
    <span id="golden-icon">✨</span>
    <span id="golden-label">Голубое</span>
</button>

<button id="music-toggle" onclick="toggleMusic()" aria-label="Включить музыку">
    <span id="music-icon">▶</span>
    <span id="music-label">Lo-fi</span>
</button>

<audio id="music-player" loop preload="none">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
</audio>

<div class="content">
    <div class="welcome-box">
        <div class="logo">🔑</div>
        <h2>Вход</h2>
        <p class="subtitle">Войдите в свой аккаунт</p>

        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="success" th:if="${success}" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="example@mail.ru" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Введите пароль" required>
            </div>
            <button type="submit">Войти</button>
        </form>

        <a href="/" class="back-link">← На главную</a>
    </div>
</div>

<script th:src="@{/auth/js/space-script.js}"></script>
</body>
</html>
