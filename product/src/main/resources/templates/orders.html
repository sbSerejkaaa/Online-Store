<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заказы</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/product/css/space-style.css}">
</head>
<body>
<div class="space-bg" style="background-image: url('/images/fon.jpg');"></div>
<canvas id="stars"></canvas>

<!-- ★ ЧАСЫ -->
<div id="clock-widget">
    <div id="clock-time">00:00:00</div>
    <div id="clock-date">-- --- ----</div>
</div>

<!-- ★ СЧЁТЧИК ОНЛАЙН -->
<div id="online-widget">
    <span class="online-dot"></span>
    <span id="online-count">42</span> человек онлайн
</div>

<!-- ★ ЛОГОТИП -->
<div id="logo-widget">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">
        <div class="logo-title">ONLINE STORE</div>
    </div>
    <div class="logo-icon">⚡</div>
</div>

<!-- ★ ВЕРХНИЕ ПРАВЫЕ КНОПКИ -->
<div class="top-right-buttons">
    <a href="/profile" class="btn-catalog">👤 Личный кабинет</a>
    <a href="/catalog" class="btn-home">📦 Каталог</a>
</div>

<!-- ★ ЗАКАЗЫ -->
<div class="catalog-wrapper">
    <div class="catalog-header">
        <h1>📋 Мои заказы</h1>
    </div>

    <div id="orders-content">
        <div class="empty-message">Загрузка...</div>
    </div>
</div>

<script>
    async function loadOrders() {
        try {
            const response = await fetch('/api/orders', { credentials: 'include' });

            if (response.status === 401) {
                window.location.href = '/login';
                return;
            }

            if (!response.ok) throw new Error('HTTP ' + response.status);

            const orders = await response.json();
            renderOrders(orders);

        } catch (err) {
            console.error('Orders load error:', err);
            document.getElementById('orders-content').innerHTML =
                '<div class="empty-message">Ошибка загрузки заказов</div>';
        }
    }

    function renderOrders(orders) {
        const container = document.getElementById('orders-content');

        if (!orders || orders.length === 0) {
            container.innerHTML = '<div class="empty-message">📭 У вас пока нет заказов</div>';
            return;
        }

        let html = '';

        orders.forEach(order => {
            const statusText = {
                'CONFIRMED': '✅ Подтверждён',
                'IN_PROCESS': '⏳ В обработке',
                'CANCELLED': '❌ Отменён'
            }[order.status] || order.status;

            const date = order.createdAt ? new Date(order.createdAt).toLocaleString('ru-RU') : '—';

            html += `
                <div class="order-card">
                    <div class="order-header">
                        <div>
                            <div class="order-id">#${order.orderId.substring(0, 8)}</div>
                            <div class="order-date">${date}</div>
                        </div>
                        <div class="order-status status-${order.status}">${statusText}</div>
                    </div>
                    <div class="order-items">
                        ${order.items.map(item => `
                            <div class="order-item">
                                <span>${item.productName}</span>
                                <span>${item.quantity} шт × ${item.unitPrice} ₽</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="order-total">
                        Итого: ${order.totalAmount != null ? order.totalAmount : '—'} ₽
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    loadOrders();
</script>

<script th:src="@{/product/js/space-script.js}"></script>
</body>
</html>
