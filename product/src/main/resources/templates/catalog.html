<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/product/css/space-style.css}">
</head>
<body>
<div class="space-bg" style="background-image: url('/images/image-1.jpg');"></div>
<canvas id="stars"></canvas>

<!-- ★ ЧАСЫ — как на profile -->
<div id="clock-widget" style="top: 30px !important; left: 40px !important; transform: scale(0.85) !important; transform-origin: top left !important;">
    <div id="clock-time">00:00:00</div>
    <div id="clock-date">-- --- ----</div>
</div>

<!-- ★ ФРАЗА — ниже часов -->
<div id="phrase-widget" style="top: 180px !important; left: 40px !important; max-width: 350px !important;">
    <div id="phrase-text">Каталог товаров</div>
</div>

<!-- ★ СЧЁТЧИК ОНЛАЙН -->
<div id="online-widget" style="top: 100px !important;">
    <span class="online-dot"></span>
    <span id="online-count">42</span> человек онлайн
</div>

<!-- ★ КНОПКА ЗОЛОТОГО РЕЖИМА -->
<button id="golden-toggle" onclick="toggleGoldenMode()" aria-label="Золотой режим" style="bottom: 160px !important;">
    <span id="golden-icon">✨</span>
    <span id="golden-label">Голубое</span>
</button>

<!-- ★ ПЛЕЕР -->
<button id="music-toggle" onclick="toggleMusic()" aria-label="Включить музыку" style="bottom: 100px !important;">
    <span id="music-icon">▶</span>
    <span id="music-label">Lo-fi</span>
</button>

<audio id="music-player" loop preload="none">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
</audio>

<div class="top-right-buttons">
    <a href="/cart" class="btn-catalog">🛒 Корзина</a>
    <a href="/profile" class="btn-catalog">👤 Личный кабинет</a>
    <a href="/" class="btn-home">🏠 На главную</a>
</div>

<div class="catalog-wrapper">
    <div class="catalog-header">
        <h1>🛒 Каталог товаров</h1>
    </div>

    <div class="products-grid">
        <div class="product-card" th:each="product : ${products}">
            <div class="product-image">
                <img th:src="${product.imageUrl}" th:alt="${product.productName}">
            </div>
            <div class="product-name" th:text="${product.productName}">Название</div>
            <div class="product-divider"></div>
            <div class="product-price" th:text="${product.price} + ' ₽'">Цена</div>
            <div class="quantity">
                <span th:text="'Остаток: ' + ${product.quantity} + ' шт'">Остаток</span>
            </div>
            <a th:href="@{/product/{id}(id=${product.productId})}" class="btn-detail">Подробнее</a>
        </div>
    </div>

    <div class="empty-message" th:if="${#lists.isEmpty(products)}">
        📦 Товаров пока нет. Загляните позже!
    </div>
</div>

<script th:src="@{/product/js/space-script.js}"></script>
</body>
</html>
