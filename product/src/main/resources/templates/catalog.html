<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/product/css/space-style.css}">
</head>
<body>
<div class="space-bg" style="background-image: url('/images/fon.jpg');"></div>
<canvas id="stars"></canvas>

<!-- ★ ЧАСЫ -->
<div id="clock-widget">
    <div id="clock-time">00:00:00</div>
    <div id="clock-date">-- --- ----</div>
</div>

<!-- ★ ЛОГОТИП -->
<div id="logo-widget">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">
        <div class="logo-title">ONLINE STORE</div>
    </div>
    <div class="logo-icon">⚡</div>
</div>

<!-- ★ ВЕРХНИЕ ПРАВЫЕ КНОПКИ -->
<div class="top-right-buttons">
    <a href="/cart" class="btn-catalog">🛒 Корзина</a>
    <a href="/profile" class="btn-catalog">👤 Личный кабинет</a>
    <a href="/" class="btn-home">🏠 На главную</a>
</div>

<!-- ★ КАТАЛОГ -->
<div class="catalog-wrapper">

    <!-- ★ ЗАГОЛОВОК (перенесли наверх) -->
    <div class="catalog-header">
        <h1>Каталог товаров</h1>
    </div>

    <!-- ★ ПОИСК -->
    <div class="search-bar">
        <form method="get" action="/catalog" class="search-form">
            <input type="text"
                   name="q"
                   placeholder="🔍 Поиск товаров..."
                   th:value="${searchQuery}"
                   class="search-input">
            <button type="submit" class="search-btn">Найти</button>
        </form>
    </div>

    <!-- ★★★ ДВУХКОЛОНОЧНЫЙ LAYOUT ★★★ -->
    <div class="catalog-layout">

        <!-- ★ САЙДБАР: КАТЕГОРИИ (слева) -->
        <aside class="categories-sidebar">
            <h3 class="sidebar-title">Категории</h3>

            <a href="/catalog"
               class="category-btn"
               th:classappend="${activeCategory == null} ? 'active'">
                <span class="category-icon">🏠</span>
                <span>Все</span>
            </a>

            <a th:each="cat : ${categories}"
               th:href="@{/catalog(category=${cat.slug})}"
               class="category-btn"
               th:classappend="${activeCategory == cat.slug} ? 'active'">
                <span class="category-icon" th:text="${cat.icon}">📱</span>
                <span th:text="${cat.name}">Телефоны</span>
            </a>
        </aside>

        <!-- ★ КОНТЕНТ: ТОВАРЫ (справа) -->
        <main class="catalog-main">
            <div class="products-grid" id="products-grid">
                <div class="product-card" th:each="product : ${products}">
                    <div class="product-image">
                        <img th:src="${product.imageUrl}" th:alt="${product.productName}">
                    </div>
                    <div class="product-name" th:text="${product.productName}">Название</div>
                    <div class="product-divider"></div>
                    <div class="product-price" th:text="${product.price} + ' ₽'">Цена</div>
                    <div class="quantity">
                        <span th:text="'Остаток: ' + ${product.quantity} + ' шт'">Остаток</span>
                    </div>
                    <a th:href="@{/product/{id}(id=${product.productId})}" class="btn-detail">Подробнее</a>
                </div>
            </div>

            <div class="empty-message" th:if="${#lists.isEmpty(products)}">
                📦 Товаров в этой категории пока нет
            </div>

            <!-- ★ Кнопка "Загрузить ещё" -->
            <div id="load-more-wrapper" style="text-align: center; margin-top: 40px; display: none;">
                <button id="load-more-btn" class="btn-detail" style="max-width: 300px; margin: 0 auto;">
                    ⬇ Загрузить ещё
                </button>
            </div>
        </main>

    </div>
</div>

<script th:src="@{/product/js/space-script.js}"></script>

<!-- ★ Пагинация (только для чистого каталога, без поиска/категории) -->
<script th:inline="javascript">
    (function() {
        // Если на странице есть фильтр (поиск/категория) — пагинацию не включаем
        const isFiltered = /*[[${searchQuery != null && !searchQuery.isEmpty()}]]*/ false
                        || /*[[${activeCategory != null}]]*/ false;
        if (isFiltered) return;

        const grid = document.getElementById('products-grid');
        const wrapper = document.getElementById('load-more-wrapper');
        const btn = document.getElementById('load-more-btn');
        if (!grid || !wrapper || !btn) return;

        let nextCursor = null;
        let loading = false;

        // Первый запрос — узнаём nextCursor (товары уже отрендерены Thymeleaf)
        async function initCursor() {
            try {
                const r = await fetch('/api/products/page?size=20');
                if (!r.ok) return;
                const data = await r.json();
                nextCursor = data.nextCursor;
                if (nextCursor) wrapper.style.display = 'block';
            } catch (e) {
                console.error('Paginate init error:', e);
            }
        }

        // Загрузка следующей страницы
        async function loadMore() {
            if (loading || !nextCursor) return;
            loading = true;
            btn.disabled = true;
            btn.textContent = '⏳ Загрузка...';

            try {
                const r = await fetch('/api/products/page?size=20&cursor=' + encodeURIComponent(nextCursor));
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const data = await r.json();

                (data.items || []).forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-image">
                            <img src="${p.imageUrl || ''}" alt="${p.productName}">
                        </div>
                        <div class="product-name">${p.productName}</div>
                        <div class="product-divider"></div>
                        <div class="product-price">${p.price} ₽</div>
                        <div class="quantity">Остаток: ${p.quantity} шт</div>
                        <a href="/product/${p.productId}" class="btn-detail">Подробнее</a>
                    `;
                    grid.appendChild(card);
                });

                nextCursor = data.nextCursor;
                if (!nextCursor) {
                    wrapper.style.display = 'none';
                }
            } catch (e) {
                console.error('Load more error:', e);
                alert('Не удалось загрузить товары');
            } finally {
                loading = false;
                btn.disabled = false;
                btn.textContent = '⬇ Загрузить ещё';
            }
        }

        btn.addEventListener('click', loadMore);
        initCursor();
    })();
</script>

</body>
</html>
