<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/product/css/space-style.css}">
</head>
<body>
<div class="space-bg" style="background-image: url('/images/fon.jpg');"></div>
<canvas id="stars"></canvas>

<!-- ★ ЧАСЫ -->
<div id="clock-widget">
    <div id="clock-time">00:00:00</div>
    <div id="clock-date">-- --- ----</div>
</div>

<!-- ★ СЧЁТЧИК ОНЛАЙН -->
<div id="online-widget">
    <span class="online-dot"></span>
    <span id="online-count">42</span> человек онлайн
</div>

<!-- ★ ЛОГОТИП -->
<div id="logo-widget">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">
        <div class="logo-title">ONLINE STORE</div>
    </div>
    <div class="logo-icon">⚡</div>
</div>

<!-- ★ ВЕРХНИЕ ПРАВЫЕ КНОПКИ -->
<div class="top-right-buttons">
    <a href="/profile" class="btn-catalog">👤 Личный кабинет</a>
    <a href="/catalog" class="btn-home">📦 Каталог</a>
</div>

<!-- ★ КОРЗИНА -->
<div class="catalog-wrapper">
    <div class="catalog-header">
        <h1>🛒 Корзина</h1>
    </div>

    <div id="cart-content">
        <div class="empty-message">Загрузка...</div>
    </div>

    <div id="cart-summary" style="display: none;">
        <div class="cart-total-row">
            Итого: <span id="cart-total">0</span> ₽
        </div>
        <div class="cart-actions">
            <button id="checkout-btn" class="btn-checkout" onclick="checkout()">
                ✅ Оформить заказ
            </button>
        </div>
    </div>

    <div id="status-modal" class="status-modal-overlay">
        <div class="status-modal-box">
            <div id="status-icon" class="status-icon">⏳</div>
            <div id="status-text" class="status-text">Оформляем заказ...</div>
            <div id="status-detail" class="status-detail"></div>
            <button id="status-close" class="status-close-btn" onclick="closeStatusModal()">
                Закрыть
            </button>
        </div>
    </div>
</div>

<script>
    let cartItems = [];

    function loadCart() {
        fetch('/api/cart', { credentials: 'include' })
            .then(r => {
                if (r.status === 401) {
                    window.location.href = '/login';
                    return null;
                }
                return r.json();
            })
            .then(cart => {
                if (!cart) return;
                cartItems = cart.items || [];
                renderCart(cart);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('cart-content').innerHTML =
                    '<div class="empty-message">Ошибка загрузки корзины</div>';
            });
    }

    function renderCart(cart) {
        const container = document.getElementById('cart-content');
        const summary = document.getElementById('cart-summary');

        if (!cart.items || cart.items.length === 0) {
            container.innerHTML = '<div class="empty-message">📦 Корзина пуста</div>';
            summary.style.display = 'none';
            return;
        }

        let html = '<div class="products-grid">';
        let total = 0;

        cart.items.forEach(item => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;

            html += `
                <div class="product-card">
                    <div class="product-image">
                        <img src="${item.imageUrl || ''}" alt="${item.productName}">
                    </div>
                    <div class="product-name">${item.productName}</div>
                    <div class="product-divider"></div>
                    <div class="product-price">${item.price} ₽</div>
                    <div class="quantity cart-quantity-row">
                        <button onclick="updateQuantity('${item.productId}', ${item.quantity - 1})" class="cart-qty-btn">−</button>
                        <span class="cart-qty-value">${item.quantity} шт</span>
                        <button onclick="updateQuantity('${item.productId}', ${item.quantity + 1})" class="cart-qty-btn">+</button>
                    </div>
                    <button class="btn-detail btn-remove-cart" onclick="removeItem('${item.productId}')">
                        🗑 Удалить
                    </button>
                </div>
            `;
        });

        html += '</div>';
        container.innerHTML = html;
        document.getElementById('cart-total').textContent = total.toFixed(2);
        summary.style.display = 'block';
    }

    function updateQuantity(productId, quantity) {
        if (quantity < 1) {
            removeItem(productId);
            return;
        }
        fetch('/api/cart/items/' + productId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ quantity: quantity })
        })
        .then(r => r.json())
        .then(cart => { cartItems = cart.items || []; renderCart(cart); })
        .catch(err => console.error(err));
    }

    function removeItem(productId) {
        fetch('/api/cart/items/' + productId, {
            method: 'DELETE',
            credentials: 'include'
        })
        .then(r => r.json())
        .then(cart => { cartItems = cart.items || []; renderCart(cart); })
        .catch(err => console.error(err));
    }

    function clearCart() {
        return fetch('/api/cart', {
            method: 'DELETE',
            credentials: 'include'
        });
    }

    function showStatusModal(icon, text, detail) {
        document.getElementById('status-icon').textContent = icon;
        document.getElementById('status-text').textContent = text;
        document.getElementById('status-detail').textContent = detail || '';
        document.getElementById('status-close').style.display = 'none';
        document.getElementById('status-modal').style.display = 'flex';
    }

    function closeStatusModal() {
        document.getElementById('status-modal').style.display = 'none';
        loadCart();
    }

    function updateStatusDetail(detail) {
        document.getElementById('status-detail').textContent = detail;
    }

    async function checkout() {
        if (cartItems.length === 0) return;

        // ★ УБРАЛИ: больше не запрашиваем /api/cart и не берём accountId
        // accountId теперь резолвится на стороне payment-service по userId

        const items = cartItems.map(item => ({
            productId: item.productId,
            productName: item.productName,
            quantity: item.quantity,
            unitPrice: item.price
        }));

        showStatusModal('⏳', 'Оформляем заказ...', 'Проверяем наличие и списываем средства');

        try {
            const response = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ items })   // ★ только items
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error('HTTP ' + response.status + ': ' + errorText);
            }

            const order = await response.json();
            console.log('Order created:', order);

            await pollOrderStatus(order.orderId);

        } catch (err) {
            console.error('Checkout error:', err);
            showStatusModal('❌', 'Ошибка оформления', err.message);
            document.getElementById('status-close').style.display = 'inline-block';
        }
    }

    async function pollOrderStatus(orderId) {
        const MAX_ATTEMPTS = 20;
        const INTERVAL_MS = 2000;

        for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
            await sleep(INTERVAL_MS);

            try {
                const r = await fetch('/api/orders/' + orderId, { credentials: 'include' });
                if (!r.ok) continue;

                const order = await r.json();
                console.log('Order status:', order.status, order);

                if (order.status === 'CONFIRMED') {
                    showStatusModal('✅', 'Заказ подтверждён!', 'Итого: ' + order.totalAmount + ' ₽');
                    await clearCart();
                    document.getElementById('status-close').style.display = 'inline-block';
                    return;
                }

                if (order.status === 'CANCELLED') {
                    showStatusModal('❌', 'Заказ отменён', 'Товара нет на складе или недостаточно средств');
                    document.getElementById('status-close').style.display = 'inline-block';
                    return;
                }

                updateStatusDetail('Проверка... (' + attempt + '/' + MAX_ATTEMPTS + ')');

            } catch (err) {
                console.error('Polling error:', err);
            }
        }

        showStatusModal('⏱', 'Заказ обрабатывается', 'Проверьте позже в личном кабинете');
        document.getElementById('status-close').style.display = 'inline-block';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    loadCart();
</script>

<script th:src="@{/product/js/space-script.js}"></script>
</body>
</html>
